# ═══════════════════════════════════════════════════════════════════════════
# Devnet Celestia cục bộ cho thí nghiệm đầu-cuối Engram
#
# Dựa trên hướng dẫn chính thức:
#   https://docs.celestia.org/operate/networks/local-devnet/
#
# ⚠ ĐÃ ĐỔI SO VỚI BẢN CHÍNH THỨC — máy này dùng chung với hạ tầng Celestia và
#   Avail của người khác, nên mọi thứ phải cách ly:
#
#     tên container   celestia-validator  →  engram-cel-validator
#                     celestia-bridge     →  engram-cel-bridge
#     cổng máy chủ    26657, 26658, 9090  →  46657, 46658  (9090 KHÔNG mở)
#
#   Chọn 46xxx chứ không 36xxx: máy này đã có cụm celestia-validator-astar*
#   dùng 36661, 36666, 36667, 39090. Hai cổng 36657/36658 hiện rảnh nhưng nằm
#   sát dải đó, nên dời hẳn ra ngoài để không va khi cụm kia mở rộng.
#     volume          celestia_*_data     →  engram_cel_*
#     mạng docker     celestia-network    →  engram-cel-net
#
#   Cổng nội bộ trong container giữ nguyên; chỉ ánh xạ ra máy chủ là đổi.
#   Cổng p2p 26656 KHÔNG mở ra ngoài: devnet này chỉ chạy trên một máy.
#
# ⚠ THÊM `--rpc.skip-auth`: node bridge mặc định đòi token xác thực. Devnet chỉ
#   nghe trên loopback nên bỏ xác thực là chấp nhận được, và nó khớp với client
#   trong repo (client bỏ header Authorization khi CELESTIA_AUTH_TOKEN rỗng).
#   ĐỪNG dùng cờ này cho node nối mạng công khai.
# ═══════════════════════════════════════════════════════════════════════════
services:
  engram-cel-validator:
    image: ghcr.io/celestiaorg/celestia-app:v6.4.4-mocha
    container_name: engram-cel-validator
    volumes:
      - engram_cel_validator:/home/celestia
    ports:
      - "127.0.0.1:46657:26657"   # RPC đồng thuận — chỉ loopback
    # ⚠ Image v6.4.4-mocha có ENTRYPOINT là /bin/celestia-appd, nên `command`
    #   bị nối thành `celestia-appd sh -c "..."` → lỗi unknown command "sh".
    #   Hướng dẫn chính thức viết cho image không có entrypoint. Ghi đè nó.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # ⚠ KHÔNG dùng biến shell ở đây: Docker Compose nội suy $ trước khi
        #   truyền vào container, nên "$H" thành chuỗi rỗng. Viết thẳng đường
        #   dẫn, hoặc phải escape thành $$H.
        #
        # `celestia-appd init` chỉ tạo genesis RỖNG. Chain từ chối khởi động với
        # "validator set is empty after InitGenesis" vì không có ai đề xuất
        # block. Cần chuỗi Cosmos SDK đầy đủ bên dưới.
        if [ ! -f /home/celestia/.celestia-app/config/genesis.json ]; then
          celestia-appd init engram-devnet --chain-id private --home /home/celestia/.celestia-app
          celestia-appd keys add validator --keyring-backend test --home /home/celestia/.celestia-app
          celestia-appd genesis add-genesis-account validator 5000000000000utia --keyring-backend test --home /home/celestia/.celestia-app
          # --fees: v6.4.4 bắt buộc phí tối thiểu (0.000001utia mỗi đơn vị
          #   gas). gentx mặc định phí 0 nên bị từ chối lúc chain khởi
          #   động: "insufficient gas price for the network".
          celestia-appd genesis gentx validator 1000000000000utia --fees 1000utia --gas 300000 --chain-id private --keyring-backend test --home /home/celestia/.celestia-app
          celestia-appd genesis collect-gentxs --home /home/celestia/.celestia-app
        fi
        # --force-no-bbr: kernel máy chủ không bật BBR và node từ chối khởi động
        #   nếu thiếu. BBR chỉ ảnh hưởng hiệu năng p2p, vô nghĩa với devnet một máy.
        # --rpc.laddr 0.0.0.0: mặc định RPC chỉ nghe loopback BÊN TRONG
        #   container, nên ánh xạ cổng ra máy chủ không tới được.
        exec celestia-appd start --home /home/celestia/.celestia-app --force-no-bbr --rpc.laddr tcp://0.0.0.0:26657 \
          --grpc.enable --grpc.address 0.0.0.0:9090
    networks:
      - engram-cel-net

  engram-cel-bridge:
    image: ghcr.io/celestiaorg/celestia-node:v0.28.5-mocha
    container_name: engram-cel-bridge
    environment:
      - P2P_NETWORK=private
    volumes:
      - engram_cel_bridge:/home/celestia
    ports:
      - "127.0.0.1:46658:26658"   # API node DA — script E2E gọi vào đây
    command: >
      celestia bridge start
      --p2p.network private
      --core.ip engram-cel-validator
      --rpc.addr 0.0.0.0
      --rpc.port 26658
      --rpc.skip-auth
    depends_on:
      - engram-cel-validator
    networks:
      - engram-cel-net

volumes:
  engram_cel_validator:
  engram_cel_bridge:

networks:
  engram-cel-net:
    driver: bridge
