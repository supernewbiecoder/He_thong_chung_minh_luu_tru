[package]
name = "sp1_shared"
version = "0.1.0"
edition = "2021"

# CHỈ serde + struct thuần. KHÔNG nova (để host không bị lôi nova → xung đột generic-array).
[dependencies]
serde = { version = "1.0", features = ["derive"] }

# Chỉ dùng cho unit test chứng minh bincode là little-endian — lý do tồn tại
# của to_packed(). Dev-dependency nên KHÔNG đi vào build riscv32 của guest.
[dev-dependencies]
bincode = "1.3.3"
