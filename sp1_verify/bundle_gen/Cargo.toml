[package]
name = "bundle-gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bundle-gen"
path = "src/main.rs"

# Dùng nova + pipeline Engram. KHÔNG sp1-sdk (xung đột generic-array).
# [SỬA] Đường dẫn trỏ `../../prover` và `../../core_primitives` khi `sp1_verify`
# còn là anh em cùng cấp với hai crate đó. Trong repo này chúng nằm trong
# `circuit/`, nên phải thêm một bậc. Lỗi cũ: "failed to read
# /…/core_primitives/Cargo.toml — No such file or directory".
[dependencies]
sp1_shared = { path = "../shared" }
prover = { path = "../../circuit/prover" }
core_primitives = { path = "../../circuit/core_primitives" }
nova-snark = { version = "0.71.1", features = ["test-utils"] }
bincode = "1.3.3"
ff = "0.13"
clap = { version = "4.0", features = ["derive"] }

[workspace]
