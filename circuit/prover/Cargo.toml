[package]
name = "prover"
version = "0.1.0"
edition = "2021"

[dependencies]
core_primitives = { path = "../core_primitives" }
pasta_curves = "0.5"
ff = "0.13"
bincode = "1.3.3" # hỗ trợ đo kích thước Proof
# test-utils: cần cho HyperKZG::setup sinh SRS dev (random tau — KHÔNG an toàn production).
# Khi lấy số liệu cho paper: bỏ feature này và dùng PublicParams::setup_with_ptau_dir
# với file ptau từ Perpetual Powers of Tau.
nova-snark = { version = "0.71.1", features = ["test-utils"] }
bellperson = "0.26.0"
serde = { version = "1.0", features = ["derive"] } # Cần thiết cho bincode
sysinfo = "0.29"
bellpepper-core = "0.4.0"
