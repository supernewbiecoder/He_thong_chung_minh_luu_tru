[workspace]
resolver = "2"
members = [
    "data_generator",
    "core_primitives",
    "prover",
    "verifier",
]

# sp1_verify KHÔNG thuộc workspace này: guest build bằng `cargo prove` (toolchain riscv
# riêng), host build bằng cargo thường. Nếu đưa vào members, `cargo build` ở đây sẽ cố
# biên dịch guest bằng toolchain thường và HỎNG. exclude để cargo bỏ qua hẳn thư mục này.
exclude = ["sp1_verify"]

# Tối ưu hóa bắt buộc cho các bài toán Cryptography/ZKP
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"