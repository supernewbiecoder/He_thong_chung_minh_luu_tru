[project]
name = "engram-watchtower"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["engram-common", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
